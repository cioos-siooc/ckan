services:
  forms:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FORMS_PORT:-8080}:80"
    volumes:
      - ./forms:/usr/share/nginx/html:ro
      - ./nginx/forms.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
